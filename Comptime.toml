# Comptime.toml – compile-time framework configuration
#
# Values are read by build.rs and baked into the binary as compile-time
# constants.  Changing this file requires recompilation (cargo build).
#
# Equivalent concept: `application.properties` in Quarkus.

[database]
# Schema management strategy.
#
# The strategy is resolved at compile time and embedded as a &'static
# constant – no config file is read at runtime.
#
# Options:
#   none            – do nothing (recommended for production)
#   validate        – panic on startup if any entity table or column is missing
#   create          – CREATE TABLE IF NOT EXISTS for each entity (safe default)
#   drop-and-create – DROP TABLE + CREATE TABLE (dev / test only, destructive!)
#   update          – create missing tables; ALTER TABLE ADD COLUMN for missing
#                     columns (no drops, safe for staging)
#
# Equivalent: quarkus.hibernate-orm.schema-management.strategy
schema-management.strategy = "create"

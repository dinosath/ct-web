[workspace]
members  = [
	"crates/ct-web",
	"crates/ct-web-macros",
	"examples/simple",
	"examples/simple-routes",
	"examples/nested/controller",
	"examples/nested/app",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

# Local checkouts of the upstream projects (sibling directories of ct-web).
[workspace.dependencies]
axum       = { path = "../axum/axum", default-features = false, features = ["http1", "json", "tokio", "query"] }
sea-orm    = { path = "../sea-orm", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-sqlite", "with-json"] }
tokio      = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5.2", default-features = false, features = ["make"] }
tower-service = "0.3"
ct-web     = { path = "crates/ct-web" }

[profile.release]
codegen-units = 1
lto           = true
panic         = "abort"

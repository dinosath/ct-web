[package]
name        = "comptime_orm"
version     = "0.1.0"
edition     = "2024"
# Minimum Rust version – nightly channels always satisfy this constraint.
rust-version = "1.94"

[dependencies]
comptime_orm_macros = { path = "../comptime_orm_macros" }
inventory = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
